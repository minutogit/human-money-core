[immutable.identity]
uuid = "PNF-TEST-V1"
name = "Path Not Found Standard"
abbreviation = "PNF"

[immutable.blueprint]
unit = "Unit"
primary_redemption_type = "goods_or_services"
collateral_type = "personal_guarantee"

[immutable.features]
allow_partial_transfers = true
balances_are_summable = true
amount_decimal_places = 2
privacy_mode = "public"
allowed_t_types = ["init", "transfer", "split", "merge", "redeem"]

[immutable.issuance]
validity_duration_range = ["P0M", "P5Y"]
issuance_minimum_validity_duration = "P0M"
additional_signatures_range = [0, 0]
allowed_signature_roles = ["guarantor"]


[immutable.custom_rules.non_existent_field]
# This rule targets a field that does not exist in the base voucher.
expression = "Voucher.some_sub_field == 'X'"
message = "Field some_sub_field is required"

[mutable.metadata]
issuer_name = "Test Council"

[mutable.app_config]
default_validity_duration = "P1Y"

[mutable.i18n]
descriptions = { en = "Path Not Found Test" }

