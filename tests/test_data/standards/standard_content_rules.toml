[immutable.identity]
uuid = "TEST-CONTENT-RULES-V1"
name = "Content Rules Standard"
abbreviation = "CRT"

[immutable.blueprint]
unit = "Points"
primary_redemption_type = "goods_or_services"
collateral_type = "personal_guarantee"

[immutable.features]
allow_partial_transfers = false
balances_are_summable = true
amount_decimal_places = 2
privacy_mode = "public"

allowed_t_types = ["init", "transfer", "split", "merge", "redeem"]
[immutable.issuance]
validity_duration_range = ["P0M", "P1Y"]
issuance_minimum_validity_duration = "P0M"
additional_signatures_range = [0, 0]
allowed_signature_roles = ["guarantor"]


[immutable.custom_rules.fixed_fields]
expression = "Voucher.nominal_value.unit == 'EUR'"
message = "Invalid core fields"

[immutable.custom_rules.allowed_values]
expression = "Voucher.nominal_value.amount in ['50.00', '100.00']"
message = "Invalid amount value"

[immutable.custom_rules.regex_patterns]
# First name must start with uppercase letter
expression = "Voucher.creator.first_name.matches('^[A-Z][a-z]+$')"
message = "First name matching failed"

[mutable.metadata]
issuer_name = "Human-Money-Core Test Suite"
homepage_url = ""

[mutable.app_config]
default_validity_duration = "P1Y"

[mutable.i18n.descriptions]
en = "INV-000000"

[signature]
# The issuer `did:key` containing their public key.
issuer_id = "0:7kX@did:key:z6Mkfd3mnXvq9vH3mETbYy5yBtefWpjpVNcxi63nFEjZH1td"

# The final Base58-encoded Ed25519 signature of the canonicalized content (without this block).
signature = "3a6zw9THgRwwyKhp5dLBokHBcwaCTpUcu2mZi1EvkXYJbY2HZUC5kgbDne6D6Ja129brWYARuL6vayfzsT9tLbGx"
