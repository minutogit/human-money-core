# .cargo/mutants.toml
# Suppressions for known, accepted mutants in cargo mutants.
#
# Each entry is either:
#   (A) semantically equivalent – behavior does not change
#   (B) structurally untestable – no real input path reaches it
#   (C) gossip limiter – slightly shifts limits without security relevance
#   (D) wrappers & untested offline edge cases
#
# Docs: https://mutants.rs/configuration.html

exclude_re = [
    # Crypto Utils
    "replace < with <= in build_hkdf_info",
    "replace \\|\\| with && in validate_user_id",
    "delete match arm GetPubkeyError::ConversionFailed",

    # (C) Gossip protocol limits (exclusion after manual analysis)
    "in Wallet::select_fingerprints_for_bundle",
    "in Wallet::process_received_fingerprints",

    # (D) Non-critical edge cases & wrappers
    "replace Wallet::cleanup_expired_fingerprints with \\(\\)",
    "in cleanup_expired_histories",
    "in cleanup_known_fingerprints",
    "delete ! in scan_and_rebuild_fingerprints",
    "replace \\+ with \\* in create_proof_of_double_spend",

    # (E) Complex, internally shielded Layer-2 proofs (12 mutants)
    # verify_and_create_proof is only conditionally reached via hostile end-to-end API tests. 
    # These are internal signature checks.
    "in Wallet::verify_and_create_proof",

    # (F) Theoretical heuristic edge case (1 mutant)
    # With identical timestamps in nanoseconds, offline resolution picks the first entry.
    "replace < with <= in resolve_conflict_offline",

    # (B) Unreachable in test build – get_argon2 is behind #[cfg(not(test))] and
    # is completely replaced by the SHA256 stub in tests. No test path reaches this code.
    "replace get_argon2 -> ",

    # (G) Semantically equivalent mutants in add_iso8601_duration (line 462)
    # new_year +/- 1 is used to calculate days_in_target_month for the target month December.
    # December always has 31 days, regardless of the year → subtraction result is always 31.
    # Every variant (+1, -1, *1) produces the same result → semantically equivalent.
    "replace \\+ with - in add_iso8601_duration",
    "replace \\+ with \\* in add_iso8601_duration",

    # (H) Structural nanosecond boundary case in validate_issuance_firewall (line 936)
    # `valid_until < required_end_dt` vs `<=`: difference only on exact timestamp equality.
    # The function is not `pub` → no direct unit test possible. The test path creates
    # valid_until via create_voucher and calculates required_end_dt via Utc::now() in separate
    # calls → always > 0ns difference. Exact equality cannot be guaranteed in tests.
    "replace < with <= in validate_issuance_firewall",
]
