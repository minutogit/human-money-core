# voucher_standards/standard_template.toml
# =================================================================================
# Template for Voucher Standard Definitions (standard_template.toml)
# =================================================================================
#
# This file serves as comprehensive documentation and a template for creating
# new, signed Voucher Standards. It explains all available fields.
#
# A standard is divided into two cryptographic zones:
# 1. [immutable]:   The "hard core" of the standard. Changes here alter the logic hash
#                   and break compatibility with existing vouchers.
# 2. [mutable]:     Flexibly customizable metadata and suggested defaults. Changes here
#                   only change the signature, not the logical validity.
#
# =================================================================================
# IMMUTABLE ZONE (Set in stone)
# Any change here alters the logic hash!
# =================================================================================

[immutable.identity]
# (String) A globally unique ID for this standard (v4 UUID).
uuid = "STANDARD-NAME-V1-YYYY-MM"
# (String) The official, human-readable name of the standard.
name = "Name of the standard (e.g. Regional-Taler)"
# (String) A common abbreviation for the nominal unit of the voucher.
abbreviation = "RT"

[immutable.blueprint]
# (String) The unit of nominal value mandatory for this standard.
unit = "Regional-Taler"
# (String) Primary redemption purpose: "goods_or_services", "time", or "physical_asset".
primary_redemption_type = "goods_or_services"
# (String) Type of collateral: "personal_guarantee", "fiat_backed", "crypto_backed", or "physical_asset".
collateral_type = "personal_guarantee"

[immutable.features]
# (Boolean) Indicates whether the voucher is divisible (split).
allow_partial_transfers = true
# (Boolean) Indicates whether nominal values are summable in the wallet UI.
balances_are_summable = true
# (Integer) Maximum number of decimal places (0 for integers, 2 for cent currencies).
amount_decimal_places = 2
# (String) Controls the privacy mode: "public", "stealth", or "flexible".
privacy_mode = "flexible"
# (Array of Strings) Allowed transaction types: "init", "transfer", "split".
allowed_t_types = ["init", "transfer", "split"]

[immutable.issuance]
# (Array of Strings) Allowed total validity duration range [Min, Max] in ISO 8601 format (e.g. ["P1Y", "P10Y"]).
validity_duration_range = ["P1Y", "P10Y"]
# (String) Circulation firewall: Minimum remaining validity duration upon creation (ISO 8601).
issuance_minimum_validity_duration = "P6M"
# (Array of Integers) Range of required additional signatures [Min, Max] (e.g. [2, 2] or [0, 3]).
additional_signatures_range = [2, 2]
# (Array of Strings) Allowed roles for these additional signatures (e.g. ["guarantor"]).
allowed_signature_roles = ["guarantor"]


# -- Section for dynamic CEL rules (Deep Inspection) --
[immutable.custom_rules.gender_diversity_male]
expression = "Voucher.signatures.filter(s, s.role != 'creator' && has(s.details.gender) && s.details.gender == '1').size() == 1"
message = "According to ISO 5218, exactly one male (1) guarantor is required."

[immutable.custom_rules.gender_diversity_female]
expression = "Voucher.signatures.filter(s, s.role != 'creator' && has(s.details.gender) && s.details.gender == '2').size() == 1"
message = "According to ISO 5218, exactly one female (2) guarantor is required."

[immutable.custom_rules.fixed_collateral_type]
expression = "has(Voucher.collateral) && Voucher.collateral.type == 'Fiat-Währung'"
message = "Collateral type must be Fiat-Währung."

[immutable.custom_rules.valid_amount]
expression = "Voucher.nominal_value.amount in ['25.00', '50.00', '100.00']"
message = "Nominal value must be exactly 25.00, 50.00 or 100.00."


# =================================================================================
# MUTABLE ZONE (Extensible)
# Changes here do NOT alter the logic hash.
# =================================================================================

[mutable.metadata]
# (String) The name of the official issuer of the standard.
issuer_name = "Name of the issuer (e.g. Community Council)"
# (String, Optional) A URL to the homepage of the standard or community.
homepage_url = "https://example.com/standard-info"
# (String, Optional) A URL to the technical documentation of the standard.
documentation_url = "https://example.com/standard-docs"
# (Array of Strings, Optional) Search keywords for categorization.
keywords = ["keyword1", "keyword2", "community-currency"]


[mutable.app_config]
# (String, Optional) The default validity duration in ISO 8601 format.
default_validity_duration = "P5Y"
# (String, Optional) Rule for rounding up the expiration date ("P1D", "P1M", "P1Y").
round_up_validity_to = "P1M"
# (String) Defines the period how long a voucher is retained on the server after `valid_until` expires.
server_history_retention = "P3M"

[mutable.i18n.descriptions]
# (String) Multilingual descriptions. The placeholder {{amount}} is automatically replaced upon creation.
de = "Gutschein für Waren oder Dienstleistungen im Wert von {{amount}} Einheiten."
en = "A voucher for goods or services worth {{amount}} units."

[mutable.i18n.footnotes]
# (String) Multilingual footnotes.
de = "Optionaler Fußnotentext."
en = "Optional footnote text."

[mutable.i18n.collateral_descriptions]
# (String) Multilingual collateral explanations.
de = "Dieser Gutschein ist durch das Vertrauen der Gemeinschaft besichert. Nicht zutreffend bei Einlösung."
en = "This voucher is backed by the trust of the community. Not applicable upon redemption."

# =================================================================================
# Block 3: Cryptographic Signature (MANDATORY)
# =================================================================================
#
# This block contains the digital signature of the issuer, proving the
# authenticity and integrity of this entire standard file.
#
[signature]
# (String) The `did:key` of the issuer. It contains the public
# key used to verify the signature.
# Format: "did:key:z..."
issuer_id = "did:key:z...PublicKeyDesHerausgebers..."

# (String) The final Base58-encoded Ed25519 signature.
# It signs the SHA3-256 hash of the canonicalized content of this file
# (excluding the [signature] block itself).
signature = "Base58EncodedSignature..."