# voucher_standards/minuto_v1/standard.toml
# ==============================================================================
# IMMUTABLE-ZONE (Konsens-Kern)
# Alle Parameter in dieser Zone bestimmen den SHA-256 logic_hash des Standards.
# ==============================================================================
[immutable.identity]
# (String) Eindeutiger ökonomischer Anker (UUID)
uuid = "MINUTO-V1-2025-09"
# (String) Primärer Anzeigename der Währung
name = "Minuto"
# (String) Offizielles Währungskürzel
abbreviation = "Minuto"

[immutable.blueprint]
# (String) Zählbare Leistungseinheit
unit = "Minuto"
# (Enum: goods_or_services, time, physical_asset) Einlösungsart
primary_redemption_type = "goods_or_services"
# (Enum: personal_guarantee, fiat_backed, crypto_backed, physical_asset) Besicherung
collateral_type = "personal_guarantee"

[immutable.features]
# (Boolean) Erlaubt Teilübertragungen (split)
allow_partial_transfers = true
# (Boolean) Erlaubt Aufsummierung im Wallet-UI
balances_are_summable = true
# (Integer) Nachkommastellen (0 = Ganzzahlen/Minuten)
amount_decimal_places = 0
# (Enum: public, stealth, flexible) Datenschutz-Modus auf L2
privacy_mode = "flexible"

# (Array[String]) Erlaubte Transaktions-Typen
allowed_t_types = ["init", "transfer", "split"]
[immutable.issuance]
# (Array[String]) Erlaubte Gesamtlaufzeiten [Min, Max] (ISO 8601)
validity_duration_range = ["P1Y", "P10Y"]
# (String) Zirkulations-Firewall: Erforderliche Restgültigkeit bei Erstellung
issuance_minimum_validity_duration = "P3Y"
# (Array[Integer]) Erforderliche Anzahl Bürgen [Min, Max]
additional_signatures_range = [2, 2]
# (Array[String]) Erlaubte Signatur-Rollen
allowed_signature_roles = ["guarantor"]

# CEL-Regeln: Geschlechterparität bei Bürgschaften gemäß ISO 5218
[immutable.custom_rules.gender_balance_male]
expression = "Voucher.signatures.filter(s, s.role != 'creator' && has(s.details.gender) && s.details.gender == '1').size() == 1"
message = "According to ISO 5218, exactly one male (1) guarantor is required."

[immutable.custom_rules.gender_balance_female]
expression = "Voucher.signatures.filter(s, s.role != 'creator' && has(s.details.gender) && s.details.gender == '2').size() == 1"
message = "According to ISO 5218, exactly one female (2) guarantor is required."

# ==============================================================================
# MUTABLE-ZONE (Präsentations- & Metadaten-Layer)
# Änderungen hier verändern den logic_hash NICHT.
# ==============================================================================
[mutable.metadata]
issuer_name = "Human Money Project"
homepage_url = "https://minutocash.org/"
documentation_url = "https://www.minuto.wiki/"
keywords = [
    "community-currency",
    "time-based",
    "mutual-credit",
    "b2b",
]

[mutable.app_config]
# (String) Vorausgewählte Gültigkeitsdauer im Wallet-Formular
default_validity_duration = "P5Y"
# (String) Aufrundung der Laufzeit auf Jahresende
round_up_validity_to = "P1Y"
# (String) Aufbewahrungsdauer auf L2-Nodes nach Ablauf
server_history_retention = "P3M"

[mutable.i18n.descriptions]
# Mehrsprachige Vertragstexte mit {{amount}} Platzhalter
de = "Ein Gutschein für Waren oder Dienstleistungen im Wert von {{amount}} Minuten qualitativer Leistung."
en = "A voucher for goods or services worth {{amount}} minutes of quality performance."

[mutable.i18n.footnotes]
de = "Gutschein-Nutzung nur für Mitspieler/innen."
en = "Voucher use for participants only."

[signature]
# Die `did:key` des Herausgebers, die seinen öffentlichen Schlüssel enthält.
issuer_id = "0:riw@did:key:z6Mki8QqVMb66hjtTwcceVXbZuSHTk61jqiprRvEhuotZmSA"

# Die finale Base58-kodierte Ed25519-Signatur des kanonisierten Inhalts (ohne diesen Block).
signature = "5aomSjj76rEb4VVjhAd6p6qvmU79wkkTpj84AnY3D9p8xRDNfxBqKL4EbEHTKfPevggafJeJuzhgYV4rvhLgMs5m"

